# 地方競馬の毎日の記録（盛岡・水沢・園田・姫路・笠松）：当日のレース情報を30分ごと、中間オッズ（3連単以外）を5分ごと（発走の16分前〜1分後のレースだけ）。
#   データは非公開のリポジトリ hassak0408/chiho-keiba の data/daily/ に置く（公開のこのリポジトリには置かない）。
#   毎朝7:47（日本時間。控えに9:07）に動き出し、最終レースの20分後（遅くとも21:40）に終わる。1回は最大5時間40分。まだ発走していないレースがあれば自分で次の回を動かす。
name: chiho-rec
on:
  schedule:
    # この置き場の定時は4〜7時間遅れて動き出す（2026-11-10〜13 の実績。どの仕組みも同じ）。そこで早い時刻をいくつも置き、
    # 先に動いた回が記録を始め、あとの回は「もう始まっている」で何もしない。早く動きすぎた回は、今日の分が置かれるまで10分おきに読み直す。
    - cron: '7 17 * * *'
    - cron: '7 19 * * *'
    - cron: '7 21 * * *'
    - cron: '47 22 * * *'
    - cron: '7 0 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: '1回で動く時間（分、最大340）'
        required: false
        default: '340'
      once:
        description: '1なら1回だけ読んで保存する（試し）'
        required: false
        default: '0'
permissions:
  contents: read
  actions: write
concurrency:
  group: chiho-rec
  cancel-in-progress: false
jobs:
  rec:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: hassak0408/chiho-keiba
          token: ${{ secrets.CHIHO_TOKEN }}
          path: store
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: 控えの回は、もう動いていれば何もしない
        id: guard
        if: github.event_name == 'schedule'
        run: |
          D=$(TZ=Asia/Tokyo date +%Y%m%d)
          if [ -f "store/data/daily/$D/race_meta.json" ]; then echo "今日の分はもう始まっている"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - name: 記録
        id: rec
        if: steps.guard.outputs.skip != '1'
        env:
          MINUTES: ${{ inputs.minutes || '340' }}
          ONCE: ${{ inputs.once }}
          GH_TOKEN: ${{ github.token }}      # 朝の出馬表を置いたら一覧作り（chiho-pick）を動かすため
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$ONCE" = "1" ]; then python chiho/rec.py store "$MINUTES" --once; else python chiho/rec.py store "$MINUTES"; fi
      - name: 次の回を動かす
        if: steps.rec.outputs.left != '' && steps.rec.outputs.left != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          MINUTES: ${{ inputs.minutes || '340' }}
        run: gh workflow run chiho-rec.yml --repo "$GITHUB_REPOSITORY" --ref main -f minutes="$MINUTES"
