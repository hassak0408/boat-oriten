# 地方競馬の毎日の記録（盛岡・水沢・園田・姫路・笠松）：当日のレース情報を30分ごと、中間オッズを5分ごと（発走の16分前〜1分後のレースだけ）。
#   データは非公開のリポジトリ hassak0408/chiho-keiba の data/daily/ に置く（公開のこのリポジトリには置かない）。
#   毎朝9:40（日本時間）に動き出し、最終レースの20分後（遅くとも21:40）に終わる。1回は最大5時間40分。まだ発走していないレースがあれば自分で次の回を動かす。
name: chiho-rec
on:
  schedule:
    - cron: '40 0 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: '1回で動く時間（分、最大340）'
        required: false
        default: '340'
      once:
        description: '1なら1回だけ読んで保存する（試し）'
        required: false
        default: '0'
permissions:
  contents: read
  actions: write
concurrency:
  group: chiho-rec
  cancel-in-progress: false
jobs:
  rec:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: hassak0408/chiho-keiba
          token: ${{ secrets.CHIHO_TOKEN }}
          path: store
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: 記録
        id: rec
        env:
          MINUTES: ${{ inputs.minutes || '340' }}
          ONCE: ${{ inputs.once }}
        run: |
          if [ "$ONCE" = "1" ]; then python chiho/rec.py store "$MINUTES" --once; else python chiho/rec.py store "$MINUTES"; fi
      - name: 次の回を動かす
        if: steps.rec.outputs.left != '' && steps.rec.outputs.left != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          MINUTES: ${{ inputs.minutes || '340' }}
        run: gh workflow run chiho-rec.yml --repo "$GITHUB_REPOSITORY" --ref main -f minutes="$MINUTES"
