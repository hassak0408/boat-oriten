# 公式の直前情報から作った preview と、v1 の preview をくらべる（手で動かす。q12/before/cmp.txt：中身、cmp2.txt：それで通知が変わるか）
name: q12-before-cmp
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oriten-write
  cancel-in-progress: false
jobs:
  cmp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node q12/before_cmp.js
      - run: node q12/before_cmp2.js
      - run: node q12/before_cmp3.js
      - name: 保存
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add q12/before/cmp.txt q12/before/cmp2.txt q12/before/cmp3.csv
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -q -m "q12：公式の直前情報と v1 の preview のくらべ"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch -q origin main && (git rebase -q origin/main || git rebase --abort)
            sleep 5
          done
          echo "保存できなかった"; exit 1
