# 中央競馬の成績表（JRA公式サイトのPDF）を落として読み、レースと馬の表にして、非公開のリポジトリ hassak0408/chiho-keiba の jra/data/年/ に置く。
#   PDFそのものは残さない。読み込みは10秒に1回まで。1回は最大5時間20分で、残りがあれば自分で次の回を動かす。
#   毎朝6:40（日本時間）に、今年の分の新しい日を足す（一覧のページを1回読むだけの日が多い）。
#   新しい成績が入った日は、不利明けの馬の前向きの記録（data/fwd/jra_furiake.txt、検証計画 F3）も作り直す。
name: jra-dl
on:
  schedule:
    - cron: '40 21 * * *'
  workflow_dispatch:
    inputs:
      years:
        description: '年（空白区切り。空なら今年）'
        required: false
        default: ''
      redo:
        description: '1なら合わないレースがあった日を、allなら全部の日を読み直す'
        required: false
        default: ''
permissions:
  contents: read
  actions: write
concurrency:
  group: jra-dl
  cancel-in-progress: false
jobs:
  dl:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: hassak0408/chiho-keiba
          token: ${{ secrets.CHIHO_TOKEN }}
          path: store
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pdfplumber
      - name: 前の状態
        id: before
        run: echo "head=$(git -C store rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: 落として読む
        id: dl
        env:
          YEARS: ${{ inputs.years }}
          REDO: ${{ inputs.redo }}
          LIMIT_MIN: '320'
        run: |
          Y="${YEARS:-$(TZ=Asia/Tokyo date +%Y)}"
          python chiho/jra/dl.py store $Y
      - name: 発売票数（掲載は約60日なので、毎朝新しい分を読んでためる。検証計画 J4）
        if: inputs.redo == ''
        continue-on-error: true
        run: |
          Y="$(TZ=Asia/Tokyo date +%Y)"
          python chiho/jra/hyo.py store $Y
      - name: 不利明けの馬の前向きの記録（検証計画 F3。新しい成績が入った日だけ）
        if: inputs.redo == '' && (steps.dl.outputs.left == '' || steps.dl.outputs.left == '0')
        continue-on-error: true
        env:
          BEFORE: ${{ steps.before.outputs.head }}
        run: |
          if git -C store diff --quiet "$BEFORE" HEAD -- jra/data && [ -f store/data/fwd/jra_furiake.txt ]; then echo "新しい成績なし"; exit 0; fi
          pip install pandas
          python chiho/jra/jfwd.py store
      - name: 次の回を動かす
        if: steps.dl.outputs.left != '' && steps.dl.outputs.left != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          YEARS: ${{ inputs.years }}
          REDO: ${{ inputs.redo }}
        run: gh workflow run jra-dl.yml --repo "$GITHUB_REPOSITORY" --ref main -f years="$YEARS" -f redo="$REDO"
