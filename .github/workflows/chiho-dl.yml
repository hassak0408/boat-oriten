# 地方競馬情報サイトの月ごとのデータ（レース情報・確定オッズ）を落として、非公開のリポジトリ hassak0408/chiho-keiba の data/ に置く（盛岡・水沢・園田・姫路・笠松だけ）。
#   毎月10日の3:10（日本時間）に前の月の分を落とす（月の終わりのすぐ後は、まだそろっていないかもしれないので10日にする）。月を指定して手で動かすこともできる。
name: chiho-dl
on:
  schedule:
    - cron: '10 18 9 * *'
  workflow_dispatch:
    inputs:
      race_months:
        description: 'レース情報の月（YYYYMM か YYYYMM-YYYYMM、空白区切り。空なら前の月）'
        required: false
        default: ''
      odds_months:
        description: 'オッズの月（2026年3月から。空なら前の月）'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: chiho-store
  cancel-in-progress: false
jobs:
  dl:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: hassak0408/chiho-keiba
          token: ${{ secrets.CHIHO_TOKEN }}
          path: store
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: 落とす
        env:
          RACE_MONTHS: ${{ inputs.race_months }}
          ODDS_MONTHS: ${{ inputs.odds_months }}
          OUT: store/data
          LIMIT_MIN: '300'
        run: python chiho/dl.py
      - name: 保存
        if: always()
        working-directory: store
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -q -m "chiho-dl：月ごとのデータ"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch -q --depth 5 origin main && (git rebase -q origin/main || git rebase --abort)
            sleep 5
          done
          echo "保存できなかった"; exit 1
