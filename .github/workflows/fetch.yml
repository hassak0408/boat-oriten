# 指定したページをそのまま保存する（オリジナル展示のページの場所探しの下調べ）
name: fetch
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'URL（空白区切り）'
        required: true
permissions:
  contents: write
concurrency:
  group: oriten-write
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests lxml
      - name: 読む
        env:
          URLS: ${{ inputs.urls }}
        run: python -m oriten.fetch_urls
      - name: 保存
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add probe
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -q -m "fetch：ページの下調べ"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch -q origin main && (git rebase -q origin/main || git rebase --abort)
            sleep 5
          done
          echo "保存できなかった"; exit 1
