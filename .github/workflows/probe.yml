# 分かっている場が何年前までさかのぼれるか、まだ分からない場のオリジナル展示のページの場所を調べる
name: probe
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oriten-write
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests lxml
      - run: python -m oriten.probe
      - name: 結果を保存
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add probe
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -q -m "probe：オリジナル展示のページ探し"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch -q origin main && (git rebase -q origin/main || git rebase --abort)
            sleep 5
          done
          echo "保存できなかった"; exit 1
