# 中央競馬の血統を集める（JRA公式サイト。検証計画「中央：血統」）。
#   1) 過去のレース結果（2016年から、馬IDと推定上りなど）→ jra/ses/年/  2) 馬のページ（父・母・母の父など）→ jra/horse/生まれ年.csv.gz
#   非公開のリポジトリ hassak0408/chiho-keiba に置く。読み込みは4秒に1回まで。1回は最大5時間20分で、残りがあれば自分で次の回を動かす。
name: jra-ped
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'ses（レース結果）／horse（馬のページ）／all（両方）'
        required: false
        default: 'all'
      limit:
        description: '1回の分（試しなら小さく）'
        required: false
        default: '320'
      chain:
        description: '1なら残りがあるとき次の回を動かす'
        required: false
        default: '1'
permissions:
  contents: read
  actions: write
concurrency:
  group: jra-ped
  cancel-in-progress: false
jobs:
  ped:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: hassak0408/chiho-keiba
          token: ${{ secrets.CHIHO_TOKEN }}
          path: store
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: 集める
        id: ped
        env:
          MODE: ${{ inputs.mode }}
          LIMIT_MIN: ${{ inputs.limit }}
        run: python chiho/jra/ped.py store "${MODE:-all}"
      - name: 次の回を動かす
        if: inputs.chain == '1' && steps.ped.outputs.left != '' && steps.ped.outputs.left != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          LIMIT: ${{ inputs.limit }}
        run: gh workflow run jra-ped.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode="$MODE" -f limit="$LIMIT" -f chain=1
